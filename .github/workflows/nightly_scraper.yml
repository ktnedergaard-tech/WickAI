name: Nightly Pattern Scraper

on:
  schedule:
    # 01:00 UTC = 03:00 dansk sommertid (CEST = UTC+2)
    # Hele vinteren rammer den 02:00 dansk tid — tæt nok på for en nat-scraper
    - cron: '0 1 * * *'
  workflow_dispatch:   # giver mulighed for at klikke "Run workflow" manuelt i GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nødvendig for at kunne pushe nye patterns

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-generativeai

      - name: Configure git identity
        run: |
          git config user.name  "WickAI Scraper"
          git config user.email "scraper@wickai.bot"

      - name: Run pattern scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py --no-commit

      - name: Commit and push if new patterns were found
        run: |
          if git diff --quiet patterns.py; then
            echo "✓ Ingen nye patterns fundet — database er opdateret"
          else
            COUNT=$(git diff patterns.py | grep "^+" | grep '"name":' | wc -l || echo "?")
            git add patterns.py
            git commit -m "scraper: ${COUNT} nye patterns tilføjet ($(date -u +%Y-%m-%d))"
            git push
            echo "✓ ${COUNT} nye patterns committed og pushet"
          fi
